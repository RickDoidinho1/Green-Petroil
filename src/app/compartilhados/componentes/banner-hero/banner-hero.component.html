<section class="hero" aria-labelledby="hero-titulo">
  <div class="hero-conteiner">

    <!-- Lado Esquerdo: Conteúdo de Texto -->
    <div class="hero-texto">
      @if (etiqueta()) {
        <span class="hero-etiqueta">{{ etiqueta() }} —</span>
      }
      <h1 id="hero-titulo" class="hero-titulo">{{ titulo() }}</h1>
      @if (descricao()) {
        <p class="hero-descricao">{{ descricao() }}</p>
      }
      @if (textoBotao()) {
        <a [routerLink]="linkBotao()" class="hero-botao">
          {{ textoBotao() }}
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </a>
      }
    </div>

    <!-- Lado Direito: Imagem com máscara curva -->
    @if (imagemUrl()) {
      <div class="hero-imagem-conteiner">
        <div class="hero-imagem-mascara">
          <img [src]="imagemUrl()" [alt]="imagemAlt()" class="hero-imagem" loading="eager"/>
        </div>
        <!-- Curva decorativa verde -->
        <div class="hero-curva-decorativa"></div>
      </div>
    }

  </div>
</section>
