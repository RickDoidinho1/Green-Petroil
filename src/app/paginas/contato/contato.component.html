<app-banner-hero
  etiqueta="Contato"
  titulo="Fale com a Green Petroil."
  descricao="Entre em contato com a nossa equipe. Estamos prontos para atender suas dúvidas, sugestões e solicitações."
/>

<section class="secao-contato">
  <div class="conteiner-secao">
    <div class="contato-layout">

      <!-- Formulário -->
      <div class="contato-formulario">
        <h2>Envie sua mensagem</h2>
        <form class="formulario">
          <div class="campo">
            <label for="nome">Nome completo</label>
            <input type="text" id="nome" placeholder="Seu nome" required />
          </div>
          <div class="campo">
            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="email@exemplo.com" required />
          </div>
          <div class="campo">
            <label for="assunto">Assunto</label>
            <input type="text" id="assunto" placeholder="Como podemos ajudar?" />
          </div>
          <div class="campo">
            <label for="mensagem">Mensagem</label>
            <textarea id="mensagem" rows="5" placeholder="Escreva sua mensagem..." required></textarea>
          </div>
          <button type="submit" class="botao-enviar">
            Enviar mensagem
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
          </button>
        </form>
      </div>

      <!-- Informações de contato -->
      <div class="contato-info">
        <h3>Nossos canais</h3>
        <div class="info-item">
          <span class="info-icone">📧</span>
          <div>
            <strong>E-mail</strong>
            <p>contato@greenpetroil.com.br</p>
          </div>
        </div>
        <div class="info-item">
          <span class="info-icone">📞</span>
          <div>
            <strong>Telefone</strong>
            <p> 4002-8922 </p>
          </div>
        </div>
        <div class="info-item">
          <span class="info-icone">📍</span>
          <div>
            <strong>Sede</strong>
            <p>######################</p>
          </div>
        </div>
        <div class="info-item">
          <span class="info-icone">🕐</span>
          <div>
            <strong>Horário</strong>
            <p>Seg a Sex, 08h às 18h</p>
          </div>
        </div>
      </div>

    </div>
  </div>
</section>
